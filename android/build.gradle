buildscript {
    ext.kotlinVersion = project.findProperty('NapSsp.kotlinVersion') ?: '1.8.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def enableVendorSdk = (project.findProperty('napSsp.enableVendorSdk') ?: 'false').toString().toBoolean()
def enabledMediations = ((project.findProperty('napSsp.mediations') ?: '') as String)
    .split(',')
    .collect { it.trim() }
    .findAll { !it.isEmpty() }
    .toSet()

def mediationEnabled = { String name -> enabledMediations.isEmpty() || enabledMediations.contains(name) }

def napSspSdkCoordinates = [
    core: 'io.github.nasmedia-tech:admixer-ssp:1.0.23',
    adManager: 'io.github.nasmedia-tech:admixer-admanager:1.0.15_delta',
    adFit: 'io.github.nasmedia-tech:admixer-adfit:1.0.12_beta',
    pangle: 'io.github.nasmedia-tech:admixer-pangle:1.0.12_beta',
    appLovin: 'io.github.nasmedia-tech:admixer-applovin:1.0.10_beta',
    unity: 'io.github.nasmedia-tech:admixer-unity:1.0.7_beta',
    adsIdentifier: 'com.google.android.gms:play-services-ads-identifier:18.0.1',
]

android {
    namespace 'com.gwangy'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'NAP_SSP_VENDOR_SDK_ENABLED', enableVendorSdk.toString()
        buildConfigField 'String', 'NAP_SSP_CORE_COORDINATE', "\"${napSspSdkCoordinates.core}\""
        buildConfigField 'String', 'NAP_SSP_AD_MANAGER_COORDINATE', "\"${napSspSdkCoordinates.adManager}\""
        buildConfigField 'String', 'NAP_SSP_ADFIT_COORDINATE', "\"${napSspSdkCoordinates.adFit}\""
        buildConfigField 'String', 'NAP_SSP_PANGLE_COORDINATE', "\"${napSspSdkCoordinates.pangle}\""
        buildConfigField 'String', 'NAP_SSP_APP_LOVIN_COORDINATE', "\"${napSspSdkCoordinates.appLovin}\""
        buildConfigField 'String', 'NAP_SSP_UNITY_COORDINATE', "\"${napSspSdkCoordinates.unity}\""
        buildConfigField 'String', 'NAP_SSP_ADS_IDENTIFIER_COORDINATE', "\"${napSspSdkCoordinates.adsIdentifier}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    // Required once the host app opts into the real vendor SDK dependencies.
    maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
    maven { url 'https://artifact.bytedance.com/repository/pangle/' }
}

dependencies {
    compileOnly 'com.facebook.react:react-android'

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    if (enableVendorSdk) {
        implementation napSspSdkCoordinates.adsIdentifier
        implementation napSspSdkCoordinates.core

        if (mediationEnabled('admanager')) {
            implementation napSspSdkCoordinates.adManager
        }
        if (mediationEnabled('adfit')) {
            implementation napSspSdkCoordinates.adFit
        }
        if (mediationEnabled('pangle')) {
            implementation napSspSdkCoordinates.pangle
        }
        if (mediationEnabled('applovin')) {
            implementation napSspSdkCoordinates.appLovin
        }
        if (mediationEnabled('unity')) {
            implementation napSspSdkCoordinates.unity
        }
    }
}
