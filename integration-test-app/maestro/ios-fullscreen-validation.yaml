appId: org.reactjs.native.example.IntegrationTestApp
---
- launchApp:
    appId: org.reactjs.native.example.IntegrationTestApp
    stopApp: true
- extendedWaitUntil:
    visible: "SDK 초기화"
    timeout: 20000
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- tapOn: "SDK 초기화"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "상단 상태 요약"
    timeout: 25000
- scrollUntilVisible:
    element: "전면 광고 (popup)"
    direction: DOWN
    timeout: 15000
- tapOn: "전면 광고 (popup)"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- scrollUntilVisible:
    element: "INTER_STATUS:LOADED:OPENED:IMPRESSION"
    direction: DOWN
    timeout: 20000
- assertVisible: "INTER_STATUS:LOADED:OPENED:IMPRESSION"
- assertVisible: "상단 상태 요약"
- scrollUntilVisible:
    element: "광고 응답 상태"
    direction: DOWN
    timeout: 15000
- assertVisible: "광고 응답 상태"
