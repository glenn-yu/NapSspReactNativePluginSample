appId: org.reactjs.native.example.IntegrationTestApp
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "허용"
    commands:
      - tapOn: "허용"
- extendedWaitUntil:
    visible: "SDK 초기화"
    timeout: 30000
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "SDK 초기화"
    timeout: 10000
- tapOn: "SDK 초기화"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "1. 배너 광고 (320×50)"
    timeout: 25000
- tapOn:
    text: "로드"
    index: 0
- extendedWaitUntil:
    visible: "BANNER_STATUS:LOADED:IMPRESSION"
    timeout: 30000
- extendedWaitUntil:
    visible: "언로드"
    timeout: 10000
- scrollUntilVisible:
    element: "2. 네이티브 광고"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "로드"
    index: 1
- extendedWaitUntil:
    visible: "NATIVE_STATUS:LOADED:IMPRESSION"
    timeout: 30000
- scrollUntilVisible:
    element: "3. 인라인 동영상 광고"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible: "재로드"
    commands:
      - tapOn: "재로드"
- runFlow:
    when:
      visible: "로드"
    commands:
      - tapOn:
          text: "로드"
          optional: true
- extendedWaitUntil:
    visible: "VIDEO_STATUS:LOADED:IMPRESSION"
    timeout: 30000
- scrollUntilVisible:
    element: "전면 광고 (popup)"
    direction: DOWN
    timeout: 15000
- tapOn: "전면 광고 (popup)"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "INTER_STATUS:LOADED:OPENED:IMPRESSION"
    timeout: 30000
- scrollUntilVisible:
    element: "리워드 동영상"
    direction: DOWN
    timeout: 15000
- tapOn: "리워드 동영상"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "REWARD_STATUS:LOADED:OPENED:IMPRESSION"
    timeout: 30000
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- extendedWaitUntil:
    visible: "REWARDED"
    timeout: 10000
- scrollUntilVisible:
    element: "전면 동영상"
    direction: DOWN
    timeout: 15000
- tapOn: "전면 동영상"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "IV_STATUS:LOADED:OPENED"
    timeout: 30000
- scrollUntilVisible:
    element: "이벤트 로그"
    direction: DOWN
    timeout: 10000
- assertVisible: "이벤트 로그"
