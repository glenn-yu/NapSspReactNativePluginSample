appId: org.reactjs.native.example.IntegrationTestApp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Nap SSP 통합 테스트 앱"
    timeout: 20000
- tapOn: "SDK 초기화"
- extendedWaitUntil:
    visible: "1. 배너 광고 (320×50)"
    timeout: 15000
- tapOn:
    text: "로드"
    index: 0
- extendedWaitUntil:
    visible: "언로드"
    timeout: 10000
- scrollUntilVisible:
    element: "2. 네이티브 광고"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "로드"
    index: 1
- scrollUntilVisible:
    element: "3. 인라인 동영상 광고"
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      visible: "재로드"
    commands:
      - tapOn: "재로드"
- runFlow:
    when:
      visible: "로드"
    commands:
      - tapOn: "로드"
- scrollUntilVisible:
    element: "전면 광고 (popup)"
    direction: DOWN
    timeout: 10000
- tapOn: "전면 광고 (popup)"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- tapOn: "리워드 동영상"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- tapOn: "전면 동영상"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- scrollUntilVisible:
    element: "이벤트 로그"
    direction: DOWN
    timeout: 10000
- assertVisible: "이벤트 로그"
