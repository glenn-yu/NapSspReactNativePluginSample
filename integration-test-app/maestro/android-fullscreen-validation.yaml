appId: com.integrationtestapp
---
- launchApp:
    appId: com.integrationtestapp
    stopApp: true
    clearState: true
- extendedWaitUntil:
    visible: "SDK 초기화"
    timeout: 20000
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- tapOn: "SDK 초기화"
- extendedWaitUntil:
    visible: "SDK: success"
    timeout: 20000
- scrollUntilVisible:
    element: "전면 광고 (popup)"
    direction: DOWN
    timeout: 15000
- tapOn: "전면 광고 (popup)"
- scrollUntilVisible:
    element: "INTER_STATUS:LOADED:OPENED:IMPRESSION"
    direction: DOWN
    timeout: 20000
- assertVisible: "INTER_STATUS:LOADED:OPENED:IMPRESSION"
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- scrollUntilVisible:
    element: "리워드 동영상"
    direction: DOWN
    timeout: 15000
- tapOn: "리워드 동영상"
- scrollUntilVisible:
    element: "REWARD_STATUS:LOADED:OPENED:IMPRESSION"
    direction: DOWN
    timeout: 20000
- assertVisible: "REWARD_STATUS:LOADED:OPENED:IMPRESSION"
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- scrollUntilVisible:
    element: "전면 동영상"
    direction: DOWN
    timeout: 15000
- tapOn: "전면 동영상"
- scrollUntilVisible:
    element: "IV_STATUS:LOADED:OPENED"
    direction: DOWN
    timeout: 20000
- assertVisible: "IV_STATUS:LOADED:OPENED"
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- assertVisible: "상단 상태 요약"
