appId: com.integrationtestapp
---
- runFlow:
    when:
      visible: "허용"
    commands:
      - tapOn: "허용"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible:
      id: "init-button"
    timeout: 30000
- tapOn:
    id: "init-button"
- extendedWaitUntil:
    visible: "SDK: success"
    timeout: 20000
- scrollUntilVisible:
    element: "1. 배너 광고 (320×50)"
    direction: DOWN
- tapOn:
    id: "banner-load-button"
- extendedWaitUntil:
    visible: "BANNER_STATUS:LOADED:IMPRESSION"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-load-button"
    direction: DOWN
- tapOn:
    id: "native-load-button"
- extendedWaitUntil:
    visible: "더보기"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      id: "native-status-top"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "native-status-top"
      text: "NATIVE_STATUS:LOADED:IMPRESSION"
    timeout: 45000
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- runFlow:
    when:
      visible: "See issues"
    commands:
      - tapOn: "Dismiss"
- scrollUntilVisible:
    element:
      id: "video-load-button"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: "video-load-button"
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- scrollUntilVisible:
    element:
      id: "video-status-top"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "video-status-top"
      text: "VIDEO_STATUS:LOADED:IMPRESSION:NOT_COMPLETED"
    timeout: 45000
    optional: true
- extendedWaitUntil:
    visible:
      id: "video-status-top"
      text: "VIDEO_STATUS:LOADED:IMPRESSION:COMPLETED"
    timeout: 45000
    optional: true
- extendedWaitUntil:
    visible: "VIDEO_STATUS:LOADED:IMPRESSION"
    timeout: 45000
    optional: true
- scrollUntilVisible:
    element: "4. 전면/리워드/전면동영상 광고"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: "interstitial-show-button"
- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
- extendedWaitUntil:
    visible: "test ad"
    timeout: 20000
    optional: true
