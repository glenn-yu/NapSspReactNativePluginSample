appId: com.integrationtestapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Nap SSP 통합 테스트 앱"
    timeout: 20000
- tapOn: "SDK 초기화"
- assertVisible: "SDK: success"
- tapOn:
    text: "로드"
    index: 0
- extendedWaitUntil:
    visible: "언로드"
    timeout: 10000
- scrollUntilVisible:
    element: "2. 네이티브 광고"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "로드"
    index: 1
- scrollUntilVisible:
    element: "3. 인라인 동영상 광고"
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      visible: "재로드"
    commands:
      - tapOn:
          text: "재로드"
          index: 0
- runFlow:
    when:
      visible: "3. 인라인 동영상 광고"
    commands:
      - tapOn:
          text: "로드"
          index: 2
          optional: true
- scrollUntilVisible:
    element: "전면 광고 (popup)"
    direction: DOWN
    timeout: 10000
- tapOn: "전면 광고 (popup)"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- tapOn: "리워드 동영상"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- scrollUntilVisible:
    element: "전면 동영상"
    direction: DOWN
    timeout: 10000
- tapOn: "전면 동영상"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- scrollUntilVisible:
    element: "이벤트 로그"
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: "이벤트 로그"
    timeout: 10000
