appId: com.integrationtestapp
---
- runFlow:
    when:
      visible: "허용"
    commands:
      - tapOn: "허용"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible:
      id: "init-button"
    timeout: 30000
- tapOn:
    id: "init-button"
- extendedWaitUntil:
    visible: "SDK: success"
    timeout: 20000
- scrollUntilVisible:
    element: "1. 배너 광고 (320×50)"
    direction: DOWN
- tapOn:
    id: "banner-load-button"
- extendedWaitUntil:
    visible: "BANNER_STATUS:LOADED:IMPRESSION"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-load-button"
    direction: DOWN
- tapOn:
    id: "native-load-button"
- extendedWaitUntil:
    visible: "더보기"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      id: "summary-native-status"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "summary-native-status"
      text: "NATIVE_STATUS:LOADED:IMPRESSION"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "video-load-button"
    direction: UP
    timeout: 30000
- tapOn:
    id: "video-load-button"
- scrollUntilVisible:
    element:
      id: "summary-video-status"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "summary-video-status"
      text: "VIDEO_STATUS:LOADED:IMPRESSION:NOT_COMPLETED"
    timeout: 45000
    optional: true
- extendedWaitUntil:
    visible:
      id: "summary-video-status"
      text: "VIDEO_STATUS:LOADED:IMPRESSION:COMPLETED"
    timeout: 45000
    optional: true
- scrollUntilVisible:
    element: "전면 광고 (popup)"
    direction: UP
- tapOn: "전면 광고 (popup)"
- extendedWaitUntil:
    visible: "Test Ad"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible:
      id: "summary-inter-status"
      text: "INTER_STATUS:LOADED:OPENED:IMPRESSION"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible:
      id: "summary-inter-status"
      text: "INTER_STATUS:LOADED:NOT_OPENED:NO_IMPRESSION"
    timeout: 12000
    optional: true
- runFlow:
    when:
      visible:
        id: "summary-inter-status"
        text: "INTER_STATUS:LOADED:NOT_OPENED:NO_IMPRESSION"
    commands:
      - tapOn: "전면 광고 (popup)"
- extendedWaitUntil:
    visible: "Test Ad"
    timeout: 20000
