apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native package is. Default is '../node_modules/react-native'
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native CLI is. Default is '../node_modules/react-native/cli.js'
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the entry point for all React Native CLI calls. Default is '../node_modules/react-native/cli.js'
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to bundle. Default is ['debug', 'release']
    // bundleInDebug = false
    // bundleInRelease = true
    // variantOutputNameSuffix = 'debug'

    /* Bundling */
    //   The bundle command. Default is 'bundle'
    // bundleCommand = "ram-bundle"
    //   The entry file for bundle command. Default is index.android.js or index.js
    // entryFile = file("../js/MyApplication.android.js")

    /* Hermes Commands */
    //   The hermes compiler command. Default is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //   The list of flags to pass to the hermes compiler. Default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

android {
    namespace "com.integrationtestapp"
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.integrationtestapp"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
