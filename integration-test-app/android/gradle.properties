napSsp.enableVendorSdk=true
# Include every mediation adapter referenced by the configured Android test ad units.
# Omitting adapters lets the SDK select unavailable networks and fail with ClassNotFoundException.
napSsp.mediations=admanager,adfit,pangle,applovin,unity

android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
# Use this property to enable support for the new architecture.
# newArchEnabled=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStorePassword=changeit
